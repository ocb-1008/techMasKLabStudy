<!DOCTYPE html>
<html>
<head>
                <style>.lw { font-size: 60px; font-family: Arial, Helvetica, sans-serif; }</style>
            </head>
            <body>
                

    
        <meta charset="utf-8">
        <title>プロフィール</title>
    

    
        <form method="post" action="/result.html">
        <table border="1" cellpadding="5">
            <tbody><tr>
                <td><label>名前（全角）</label></td>
                <td>[<input type="text" name="fullname" style="border:none; width:100px;">]</td>
            </tr>

            <tr>
                <td><label>カナ（半角）</label></td>
                <td>[<input type="text" name="kana" pattern="[ｦ-ﾟ]+" title="半角カナだけ入力できます" style="border:none; outline:none; width:100px;">]
                </td>
            </tr>

            <tr>
                <td><label>年齢</label></td>
                <td>
                 [<input type="number" min="1" max="100" style="border:none; outline:none; width:50px;">]
                </td>
            </tr>

            <tr>
                <td><label>自己紹介（100文字以内）</label></td>
                <td> 
                 <textarea name="txt" rows="8" cols="40" maxlength="100"></textarea>
                </td>
            </tr>

            <tr>
                <td><label>出身地</label></td>
                <td>
                 [<input type="text" name="prefecture" style="border:none; width:80px;">]

                  <option value="東京都">東京都</option>
                  <option value="神奈川県">神奈川県</option>
                  <option value="新潟県">新潟県</option>
                  <option value="富山県">富山県</option>
                  <option value="石川県">石川県</option>
                  <option value="福井県">福井県</option>
                  <option value="山梨県">山梨県</option>
                  <option value="長野県">長野県</option>
                  <option value="岐阜県">岐阜県</option>
                  <option value="静岡県">静岡県</option>
                  <option value="愛知県">愛知県</option>
                  <option value="三重県">三重県</option>
                  <option value="滋賀県">滋賀県</option>
                  <option value="京都府">京都府</option>
                  <option value="大阪府">大阪府</option>
                  <option value="兵庫県">兵庫県</option>
                  <option value="奈良県">奈良県</option>
                  <option value="和歌山県">和歌山県</option>
                  <option value="鳥取県">鳥取県</option>
                  <option value="島根県">島根県</option>
                  <option value="岡山県">岡山県</option>
                  <option value="広島県">広島県</option>

            </tr>

            <tr>
                <td><label>性別</label></td>
                <td>
                 <input type="radio" name="gender" value="gender1" checked="checked">男性
                 <input type="radio" name="gender" value="gendr2">女性
               </td>
            </tr>

            <tr>
               <td><label>趣味</label></td>
               <td>
                <input type="checkbox" name="hobby" value="hobby1">映画
                <input type="checkbox" name="hobby" value="hobby2">釣り
                <input type="checkbox" name="hobby" value="hobby3">読書
                <input type="checkbox" name="hobby" value="hobby4">カラオケ
                <input type="checkbox" name="hobby" value="hobby5">ボーリング
               </td>
            </tr>

            <tr>
               <td><label>生年月日</label></td>
               <td>
                <input type="date" min="1980-01-01" max="2021-01-01">
               </td>
            </tr>

            <tr>
               <td><label>パスワード</label></td>
               <td>
                <input type="password" name="password" size="5" maxlength="5">
               </td>
            </tr>

            <tr>
               <td colspan="2" align="center">
                <input type="submit" value="確定">
               </td>
            </tr>

        </tbody></table>
