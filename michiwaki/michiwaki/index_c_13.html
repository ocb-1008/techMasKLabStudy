<!DOCTYPE html>
<html>
<head>
                <style>.wrapper_1 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr 1fr 1fr;
}

.box1{
  grid-column-start: 1;
  grid-column-end: 4;
  background: #0000ff;
}

.wrapper_2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-column-start: 1;
  grid-column-end: 4; 
}

.box2{
  background: #00ff00;
}

.box3{
  background: #ff0000;
}

.wrapper_3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-column-start: 1;
  grid-column-end: 4; 
}

.box4{ 
  background: #00ffff;
}
.box5{ 
  background: #fafafa; 
}
.box6{ 
  background: #ffff00;
}

.wrapper_4 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-column-start: 1;
  grid-column-end: 4; 
}

.box7{
  background: #600060;
}

.box8{
  background: #ff00ff;
}

.box9{
  background: #8b6523;
  grid-column-start: 1;
  grid-column-end: 4;
}
</style>
            </head>
            <body>
                
  <div class="wrapper_1">
    <div class="box1">herder</div>

    <div class="wrapper_2">
     <div class="box2">content-1</div>
     <div class="box3">content-2</div>
    </div>

    <div class="wrapper_3">
     <div class="box4">content-3-1</div>
     <div class="box5">content-3-2</div>
     <div class="box6">content-3-3</div>
    </div>

    <div class="wrapper_4">
     <div class="box7">content-4-1</div>
     <div class="box8">content-4-2</div>
    </div>

    <div class="box9">fooder</div>
  </div>




                <script></script>
            
        
    </body>
